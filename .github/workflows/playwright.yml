name: Playwright Tests with Allure History and GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Install Allure CLI
      run: npm install -g allure-commandline --save-dev

    # ------------------------------
    # DOWNLOAD PREVIOUS ALLURE HISTORY
    # ------------------------------
    - name: Download Allure History
      uses: actions/download-artifact@v4
      with:
        name: allure-history
        path: allure-history
      continue-on-error: true

    # ------------------------------
    # RUN TESTS AND GENERATE RESULTS
    # ------------------------------
    - name: Run Playwright Tests
      run: npx playwright test --reporter=line,allure-playwright

    # ------------------------------
    # GENERATE NEW ALLURE REPORT
    # ------------------------------
    - name: Generate Allure Report
      run: |
        mkdir -p allure-history
        allure generate allure-results --clean -o allure-report
        cp -r allure-report/history allure-history || true

    # ------------------------------
    # UPLOAD HISTORY FOR NEXT RUN
    # ------------------------------
    - name: Upload Allure History
      uses: actions/upload-artifact@v4
      with:
        name: allure-history
        path: allure-history

    # ------------------------------
    # DEPLOY REPORT TO GITHUB PAGES
    # ------------------------------
    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-report
